[package]
name = "keepsake-sqlx"
version = "4.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "SQLx adapter for keepsake lifecycle storage"
readme = "../../README.md"
categories = ["database"]
keywords = ["sqlx", "database", "lifecycle", "audit"]
documentation = "https://docs.rs/keepsake-sqlx"

[features]
default = ["postgres", "cache", "fulfillment-counters", "migrations"]
cache = ["dep:moka"]
postgres = ["sqlx/postgres", "sqlx/uuid", "sqlx/time", "sqlx/json", "dep:dovecote-sqlx-postgres"]
sqlite = ["sqlx/sqlite", "sqlx/time", "sqlx/json", "dep:dovecote-sqlx-sqlite"]
mysql = ["sqlx/mysql", "sqlx/time", "sqlx/json", "dep:dovecote-sqlx-mysql"]
dovecote-postgres = ["postgres"]
dovecote-sqlite = ["sqlite"]
dovecote-mysql = ["mysql"]
dovecote = ["dovecote-postgres", "dovecote-sqlite", "dovecote-mysql"]
migrations = ["sqlx/migrate"]
fulfillment-counters = []
postgres-tests = ["postgres", "cache", "fulfillment-counters", "migrations"]
sqlite-tests = ["sqlite", "cache", "fulfillment-counters", "migrations"]
mysql-tests = ["mysql", "cache", "fulfillment-counters", "migrations"]

[dependencies]
async-trait.workspace = true
keepsake.workspace = true
moka = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
uuid.workspace = true
time.workspace = true
dovecote.workspace = true
dovecote-sqlx-postgres = { workspace = true, optional = true }
dovecote-sqlx-mysql = { workspace = true, optional = true }
dovecote-sqlx-sqlite = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

[[test]]
name = "dovecote_sqlite"
required-features = ["sqlite", "migrations"]

[lints]
workspace = true
